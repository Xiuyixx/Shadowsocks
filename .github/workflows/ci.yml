name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq iproute2 util-linux openssl xz-utils
      - name: Check shell syntax
        run: |
          for script in install.sh uninstall.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Run ShellCheck
        run: shellcheck -S style install.sh uninstall.sh tests/*.sh
      - name: Run tests
        run: |
          for test_file in tests/test_*.sh; do
            bash "$test_file"
          done
